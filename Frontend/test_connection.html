<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend-Backend Connection</title>
</head>
<body>
    <h1>Testing GrabCart Connection</h1>
    <div id="results"></div>
    
    <script>
        async function testConnection() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Testing...</h2>';
            
            try {
                // Test 1: Get products
                const productsResponse = await fetch('http://localhost:5000/api/products');
                const products = await productsResponse.json();
                results.innerHTML += '<h3>✅ Products API works</h3>';
                results.innerHTML += '<pre>' + JSON.stringify(products, null, 2) + '</pre>';
                
                // Test 2: Add item to cart
                const addResponse = await fetch('http://localhost:5000/api/detect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cart_id: 'test-cart',
                        tag_id: 101
                    })
                });
                const addResult = await addResponse.json();
                results.innerHTML += '<h3>✅ Add to cart works</h3>';
                results.innerHTML += '<pre>' + JSON.stringify(addResult, null, 2) + '</pre>';
                
                // Test 3: Get cart contents
                const cartResponse = await fetch('http://localhost:5000/api/cart/test-cart');
                const cart = await cartResponse.json();
                results.innerHTML += '<h3>✅ Get cart works</h3>';
                results.innerHTML += '<pre>' + JSON.stringify(cart, null, 2) + '</pre>';
                
                results.innerHTML += '<h2>🎉 All tests passed! Frontend can communicate with backend!</h2>';
                
            } catch (error) {
                results.innerHTML += '<h2>❌ Error:</h2>';
                results.innerHTML += '<pre>' + error.message + '</pre>';
            }
        }
        
        testConnection();
    </script>
</body>
</html>
